workflows:
  ios-27-2-1-unsigned:
    name: iOS 27.2.1 Unsigned
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: 27.2
      cocoapods: default
    scripts:
      - name: Build Unsigned IPA 16.0 to 27.2.1
        script: |
          xcodebuild -version
          xcodebuild -showsdks
          xcodebuild -project ThreeOneOSFive.xcodeproj \
            -target 3105 \
            -sdk iphoneos \
            -configuration Release \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            IPHONEOS_DEPLOYMENT_TARGET=16.0 \
            build
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "3105.app" | head -n 1)
          echo "APP: $APP_PATH"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r ThreeOneOSFive-27.2.1.ipa Payload
    artifacts:
      - ThreeOneOSFive-27.2.1.ipa
