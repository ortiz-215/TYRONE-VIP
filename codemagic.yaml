workflows:
  ios-27-2-1-unsigned:
    name: iOS 27.2.1 Unsigned
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: 27.2
      cocoapods: default
    scripts:
      - name: Build Unsigned IPA 16.0 to 27.2.1
        script: |
          set -ex
          ls -la
          xcodebuild -project ThreeOneOSFive.xcodeproj \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "*.app" | head -n 1)
          echo "APP: $APP_PATH"
          ls -lh "$APP_PATH"
          rm -rf Payload ThreeOneOSFive-27.2.1.ipa
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r ThreeOneOSFive-27.2.1.ipa Payload
          ls -lh *.ipa
    artifacts:
      - ThreeOneOSFive-27.2.1.ipa
