name: Build IPA iOS 16 - 27.2.1

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          ls /Applications/ | grep Xcode
          sudo xcode-select -s /Applications/Xcode.app || true
          xcodebuild -version
          xcodebuild -showsdks

      - name: Build App
        run: |
          xcodebuild -project ThreeOneOSFive.xcodeproj \
          -scheme ThreeOneOSFive \
          -sdk iphoneos \
          -configuration Release \
          -destination "generic/platform=iOS" \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGN_IDENTITY="" \
          IPHONEOS_DEPLOYMENT_TARGET=16.0 \
          build

      - name: Create IPA
        run: |
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "3105.app" | head -n 1)
          echo "APP: $APP_PATH"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r ThreeOneOSFive-27.2.1.ipa Payload
          ls -lh *.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ThreeOneOSFive-iOS-16-to-27.2.1
          path: ThreeOneOSFive-27.2.1.ipa
